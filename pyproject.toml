[project]
name = "generador-axial"
version = "2.0.0"
description = "Modelo analítico, piezas CAD y reportes de un generador de flujo axial con imanes de neodimio (Sadiku, Elementos de Electromagnetismo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
generador-axial = "generador_axial.presentacion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
e2e = [
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generador_axial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not interfaz'"
markers = ["interfaz: pruebas de extremo a extremo del visualizador en Chromium (lentas; uv run --group e2e pytest -m interfaz)"]
